<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Kelasku - Platform Pembelajaran Interaktif</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel Standalone (Latest supporting ES2020+) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* ===== RUANG KELASKU — CERIA & COLORFUL THEME ===== */
        :root {
            --rk-blue: #5B8DEF;
            --rk-blue-dark: #4777D8;
            --rk-yellow: #FFD166;
            --rk-coral: #FF8A7A;
            --rk-green: #67C587;
            --rk-purple: #9B8AFB;
            --rk-pink: #F38BA8;
            --rk-cream: #FFFDF7;
        }

        body {
            background:
                radial-gradient(circle at 8% 8%, rgba(255,209,102,.18), transparent 24%),
                radial-gradient(circle at 92% 14%, rgba(155,138,251,.14), transparent 25%),
                radial-gradient(circle at 85% 88%, rgba(103,197,135,.12), transparent 24%),
                #f8fafc;
        }

        /* Kartu dibuat sedikit lebih playful */
        .rounded-2xl { border-radius: 1.15rem !important; }
        .rounded-3xl { border-radius: 1.5rem !important; }

        /* Hover kartu */
        .shadow-sm {
            box-shadow: 0 4px 14px rgba(91,141,239,.07) !important;
        }

        /* Tombol primary */
        button.bg-sky-500 {
            background: linear-gradient(135deg, #5B8DEF, #6C7FF2) !important;
        }
        button.bg-sky-500:hover {
            background: linear-gradient(135deg, #4777D8, #5B6FE0) !important;
        }

        /* Ikon/aksen biru */
        .text-sky-500, .text-sky-600 { color: #5B8DEF !important; }
        .bg-sky-50 { background-color: #EEF4FF !important; }
        .border-sky-100 { border-color: #DCE8FF !important; }

        /* Beberapa aksen dibuat lebih ceria */
        .bg-emerald-500 {
            background: linear-gradient(135deg, #67C587, #48B978) !important;
        }
        .bg-amber-500 {
            background: linear-gradient(135deg, #FFD166, #F5B942) !important;
        }

        /* Scrollbar */
        ::-webkit-scrollbar-thumb {
            background: #B9C9EE;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8FA8E5;
        }

        /* Login page */
        .min-h-screen.bg-slate-100 {
            background:
                radial-gradient(circle at 10% 20%, rgba(255,209,102,.28), transparent 22%),
                radial-gradient(circle at 90% 15%, rgba(155,138,251,.22), transparent 24%),
                radial-gradient(circle at 85% 85%, rgba(103,197,135,.20), transparent 25%),
                #F8FAFF !important;
        }

        /* Logo */
        .bg-gradient-to-tr.from-sky-500.to-blue-600 {
            background: linear-gradient(135deg, #5B8DEF, #8B7CF6) !important;
        }

        /* Banner dashboard */
        .bg-gradient-to-r.from-sky-500.to-blue-600 {
            background:
                radial-gradient(circle at 85% 20%, rgba(255,209,102,.35), transparent 20%),
                linear-gradient(135deg, #5B8DEF 0%, #6978EE 55%, #8B7CF6 100%) !important;
        }

        /* Header mobile */
        .md\:hidden.fixed.top-0 {
            background: rgba(255,255,255,.94) !important;
            backdrop-filter: blur(12px);
        }

        /* Sidebar aktif */
        aside button.bg-sky-50 {
            background: linear-gradient(90deg, #EEF4FF, #F2F0FF) !important;
            border-color: #DCE8FF !important;
        }

        /* Input focus lebih lembut */
        input:focus, textarea:focus, select:focus {
            box-shadow: 0 0 0 3px rgba(91,141,239,.12);
        }

        /* Judul halaman lebih ramah */
        h1, h2, h3 {
            letter-spacing: -0.015em;
        }

        /* Badge mata pelajaran */
        span.bg-sky-50.text-sky-600 {
            background: #EEF4FF !important;
            color: #4777D8 !important;
        }

    </style>
</head>
<body class="antialiased selection:bg-sky-500 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Key untuk LocalStorage
        const STORAGE_KEY = 'ruang_kelasku_v2_db';

        // Helper untuk ID unik
        const generateId = () => 'id_' + Math.random().toString(36).substr(2, 9);

        // Data Awal Aplikasi
        const DEFAULT_DATA = {
            profile: {
                teacherName: "Bu Guru Rahmawati, S.Pd.",
                className: "Kelas VI-A",
                school: "SD Negeri 30 Lahat",
                year: "2026/2027"
            },
            students: [
                { id: "s1", name: "Ahmad Zaki", username: "ahmad06", password: "123", status: "aktif" },
                { id: "s2", name: "Budi Santoso", username: "budi06", password: "123", status: "aktif" },
                { id: "s3", name: "Citra Kirana", username: "citra06", password: "123", status: "aktif" },
                { id: "s4", name: "Dina Olivia", username: "dina06", password: "123", status: "aktif" }
            ],
            materials: [
                {
                    id: "m1",
                    subject: "IPAS",
                    title: "Sistem Pernapasan Manusia",
                    meeting: "Pertemuan 1",
                    description: "Mengenal organ-organ pernapasan pada manusia dan fungsinya secara detail.",
                    content: "Organ pernapasan manusia terdiri dari hidung, faring, laring, trakea, bronkus, bronkiolus, dan paru-paru (alveolus).\n\nFungsi utama organ pernapasan adalah tempat pertukaran gas oksigen (O2) dan karbon dioksida (CO2) yang sangat penting bagi kehidupan manusia.",
                    attachmentName: "Ringkasan_Pernapasan.pdf",
                    attachmentType: "pdf",
                    attachmentData: null,
                    createdAt: new Date().toISOString()
                },
                {
                    id: "m2",
                    subject: "Matematika",
                    title: "Pecahan Campuran & Desimal",
                    meeting: "Pertemuan 2",
                    description: "Operasi hitung penjumlahan dan pengurangan pecahan campuran.",
                    content: "Untuk menjumlahkan pecahan campuran, samakan terlebih dahulu penyebutnya atau ubah pecahan campuran menjadi pecahan biasa.",
                    attachmentName: null,
                    attachmentType: null,
                    attachmentData: null,
                    createdAt: new Date().toISOString()
                }
            ],
            quizzes: [
                {
                    id: "q1",
                    subject: "IPAS",
                    title: "Quiz Sistem Pernapasan",
                    instructions: "Kerjakan soal-soal pilihan ganda berikut dengan teliti dan tepat!",
                    questionCount: 2,
                    timeLimit: 10,
                    startDate: new Date().toISOString(),
                    endDate: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString(),
                    status: "aktif",
                    questions: [
                        {
                            id: "q1_1",
                            text: "Apa fungsi utama alveolus pada paru-paru manusia?",
                            options: { A: "Memompa darah ke seluruh tubuh", B: "Tempat pertukaran gas oksigen dan karbon dioksida", C: "Menyaring udara dari debu kasar", D: "Menghasilkan pita suara" },
                            correct: "B",
                            explanation: "Alveolus adalah gelembung halus tempat terjadinya pertukaran O2 dan CO2 di paru-paru."
                        },
                        {
                            id: "q1_2",
                            text: "Rambut halus di dalam rongga hidung berfungsi untuk...",
                            options: { A: "Menghangatkan udara dingin", B: "Melembapkan udara luar", C: "Menyaring debu dan kotoran udara", D: "Mencium bau masakan" },
                            correct: "C",
                            explanation: "Rambut hidung berguna untuk menyaring partikel debu dan kotoran yang masuk bersama udara."
                        }
                    ]
                }
            ],
            announcements: [
                {
                    id: "a1",
                    title: "Selamat Datang di Semester Baru!",
                    content: "Mari bersiap menyambut pembelajaran dengan penuh semangat. Pastikan selalu memeriksa materi pelajaran terbaru di platform Ruang Kelasku.",
                    startDate: new Date().toISOString(),
                    endDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString(),
                    link: "https://sdn30lahat.sch.id",
                    status: "aktif"
                }
            ],
            grades: [
                { id: "g1", studentId: "s1", studentName: "Ahmad Zaki", quizId: "q1", quizTitle: "Quiz Sistem Pernapasan", subject: "IPAS", score: 100, date: new Date(Date.now() - 2 * 60 * 60 * 1000).toISOString() },
                { id: "g2", studentId: "s2", studentName: "Budi Santoso", quizId: "q1", quizTitle: "Quiz Sistem Pernapasan", subject: "IPAS", score: 50, date: new Date(Date.now() - 5 * 60 * 60 * 1000).toISOString() }
            ]
        };

        const Card = ({ children, className = '', onClick = null }) => (
            <div onClick={onClick} className={`bg-white rounded-2xl border border-slate-100 p-5 shadow-sm hover:shadow-md transition-all ${className}`}>
                {children}
            </div>
        );

        const Button = ({ children, variant = 'primary', className = '', ...props }) => {
            const variants = {
                primary: 'bg-sky-500 hover:bg-sky-600 text-white shadow-sky-200',
                secondary: 'bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200',
                danger: 'bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200',
                success: 'bg-emerald-500 hover:bg-emerald-600 text-white shadow-emerald-200',
                outline: 'border border-sky-500 text-sky-600 hover:bg-sky-50',
                ghost: 'text-slate-500 hover:bg-slate-100'
            };
            return (
                <button 
                    {...props} 
                    className={`px-4 py-2 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition-all active:scale-95 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed ${variants[variant] || variants.primary} ${className}`}
                >
                    {children}
                </button>
            );
        };

        const Badge = ({ children, variant = 'blue' }) => {
            const styles = {
                blue: 'bg-sky-50 text-sky-600 border-sky-100',
                green: 'bg-emerald-50 text-emerald-600 border-emerald-100',
                yellow: 'bg-amber-50 text-amber-600 border-amber-100',
                red: 'bg-rose-50 text-rose-600 border-rose-100',
                gray: 'bg-slate-100 text-slate-600 border-slate-200'
            };
            return (
                <span className={`px-2.5 py-0.5 rounded-lg text-[11px] font-bold border ${styles[variant] || styles.blue} inline-block`}>
                    {children}
                </span>
            );
        };

        const Modal = ({ isOpen, onClose, title, children, maxWidth = 'max-w-2xl' }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-fade-in">
                    <div className={`bg-white rounded-3xl w-full ${maxWidth} max-h-[90vh] flex flex-col shadow-2xl overflow-hidden border border-slate-100`}>
                        <div className="p-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                            <h3 className="font-bold text-slate-800 text-base flex items-center gap-2">{title}</h3>
                            <button onClick={onClose} className="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-500 transition-colors">
                                <i className="ph-bold ph-x"></i>
                            </button>
                        </div>
                        <div className="p-6 overflow-y-auto flex-1 space-y-4">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const Toast = ({ message, onClose }) => {
            if (!message) return null;
            return (
                <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 animate-bounce border border-slate-700 text-xs font-semibold">
                    <i className="ph-fill ph-check-circle text-emerald-400 text-lg"></i>
                    <span>{message}</span>
                    <button onClick={onClose} className="ml-2 text-slate-400 hover:text-white">
                        <i className="ph-bold ph-x"></i>
                    </button>
                </div>
            );
        };

        const LoginPage = ({ onLogin, db, showToast }) => {
            const [role, setRole] = useState('student');
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                setError('');

                if (role === 'teacher') {
                    if ((username.trim().toLowerCase() === 'guru' || username.trim() !== '') && password === '123') {
                        onLogin({
                            role: 'teacher',
                            name: db.profile.teacherName,
                            username: username
                        });
                        showToast(`Selamat datang, ${db.profile.teacherName}!`);
                    } else {
                        setError('Username atau Password Guru salah! (Default: username: guru, pass: 123)');
                    }
                } else {
                    const foundStudent = db.students.find(
                        s => s.username.toLowerCase() === username.trim().toLowerCase() && s.password === password
                    );
                    if (foundStudent) {
                        onLogin({
                            role: 'student',
                            id: foundStudent.id,
                            name: foundStudent.name,
                            username: foundStudent.username
                        });
                        showToast(`Selamat datang, ${foundStudent.name}!`);
                    } else {
                        setError('Username/Password Siswa tidak cocok! (Contoh: ahmad06 / 123)');
                    }
                }
            };

            const quickLoginTeacher = () => {
                onLogin({ role: 'teacher', name: db.profile.teacherName, username: 'guru' });
                showToast(`Login sebagai Guru: ${db.profile.teacherName}`);
            };

            const quickLoginStudent = (student) => {
                onLogin({ role: 'student', id: student.id, name: student.name, username: student.username });
                showToast(`Login sebagai Siswa: ${student.name}`);
            };

            return (
                <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                    <div className="bg-white w-full max-w-md rounded-3xl p-6 sm:p-8 shadow-xl border border-slate-100 space-y-6">
                        <div className="text-center space-y-2">
                            <div className="w-14 h-14 bg-gradient-to-tr from-sky-500 to-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl font-black mx-auto shadow-lg shadow-sky-200">
                                RK
                            </div>
                            <h1 className="text-2xl font-black text-slate-800">Ruang Kelasku</h1>
                            <p className="text-xs text-slate-400 font-semibold">{db.profile.className} • {db.profile.school}</p>
                        </div>

                        <div className="bg-slate-100 p-1.5 rounded-2xl grid grid-cols-2 gap-1">
                            <button
                                type="button"
                                onClick={() => { setRole('student'); setError(''); }}
                                className={`py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 ${role === 'student' ? 'bg-white text-sky-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                            >
                                <i className="ph-bold ph-student"></i>
                                <span>Siswa</span>
                            </button>
                            <button
                                type="button"
                                onClick={() => { setRole('teacher'); setError(''); }}
                                className={`py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 ${role === 'teacher' ? 'bg-white text-sky-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                            >
                                <i className="ph-bold ph-chalkboard-teacher"></i>
                                <span>Guru</span>
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            {error && (
                                <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-600 text-xs font-medium flex items-center gap-2">
                                    <i className="ph-bold ph-warning-circle text-base shrink-0"></i>
                                    <span>{error}</span>
                                </div>
                            )}

                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1.5">
                                    Username {role === 'teacher' ? 'Guru' : 'Siswa'}
                                </label>
                                <div className="relative">
                                    <i className="ph-bold ph-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                                    <input
                                        type="text"
                                        required
                                        placeholder={role === 'teacher' ? 'Masukkan username (cth: guru)' : 'Masukkan username (cth: ahmad06)'}
                                        value={username}
                                        onChange={(e) => setUsername(e.target.value)}
                                        className="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold focus:outline-sky-500 bg-slate-50/50 focus:bg-white transition-all"
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1.5">
                                    Kata Sandi (Password)
                                </label>
                                <div className="relative">
                                    <i className="ph-bold ph-lock-key absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                                    <input
                                        type="password"
                                        required
                                        placeholder="Masukkan password (default: 123)"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold focus:outline-sky-500 bg-slate-50/50 focus:bg-white transition-all"
                                    />
                                </div>
                            </div>

                            <Button type="submit" className="w-full py-3 text-xs font-bold mt-2">
                                Masuk Ke Ruang Kelasku <i className="ph-bold ph-sign-in"></i>
                            </Button>
                        </form>

                        <div className="pt-4 border-t border-slate-100 space-y-2">
                            <p className="text-[10px] font-bold uppercase tracking-wider text-slate-400 text-center">Akses Cepat (Tanpa Ketik):</p>
                            <div className="flex flex-col gap-1.5">
                                <button
                                    type="button"
                                    onClick={quickLoginTeacher}
                                    className="w-full py-2 px-3 rounded-xl bg-sky-50 hover:bg-sky-100 text-sky-700 text-xs font-bold flex items-center justify-between border border-sky-100 transition-colors"
                                >
                                    <span className="flex items-center gap-2 truncate">
                                        <i className="ph-bold ph-user-gear text-sky-500"></i>
                                        Masuk sebagai Guru ({db.profile.teacherName})
                                    </span>
                                    <i className="ph-bold ph-arrow-right shrink-0"></i>
                                </button>
                                {db.students.slice(0, 2).map((st) => (
                                    <button
                                        key={st.id}
                                        type="button"
                                        onClick={() => quickLoginStudent(st)}
                                        className="w-full py-2 px-3 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-bold flex items-center justify-between border border-slate-100 transition-colors"
                                    >
                                        <span className="flex items-center gap-2 truncate">
                                            <i className="ph-bold ph-user-circle text-slate-400"></i>
                                            Masuk sebagai Siswa ({st.name})
                                        </span>
                                        <i className="ph-bold ph-arrow-right shrink-0"></i>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AppLayout = ({ user, setUser, currentView, setCurrentView, profile, onLogout, children }) => {
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            const teacherMenu = [
                { id: 'dashboard', label: 'Beranda', icon: 'ph-fill ph-house' },
                { id: 'materials', label: 'Materi Pelajaran', icon: 'ph-fill ph-books' },
                { id: 'quiz', label: 'Quiz & Evaluasi', icon: 'ph-fill ph-pencil-simple' },
                { id: 'reports', label: 'Laporan Nilai', icon: 'ph-fill ph-chart-line-up' },
                { id: 'announcements', label: 'Pengumuman', icon: 'ph-fill ph-megaphone' },
                { id: 'students', label: 'Data Siswa', icon: 'ph-fill ph-users' },
                { id: 'profile', label: 'Pengaturan Profil', icon: 'ph-fill ph-gear' },
            ];

            const studentMenu = [
                { id: 'dashboard', label: 'Beranda', icon: 'ph-fill ph-house' },
                { id: 'materials', label: 'Materi Pelajaran', icon: 'ph-fill ph-books' },
                { id: 'quiz', label: 'Quiz & Evaluasi', icon: 'ph-fill ph-pencil-simple' },
                { id: 'announcements', label: 'Pengumuman', icon: 'ph-fill ph-megaphone' },
            ];

            const navItems = user.role === 'teacher' ? teacherMenu : studentMenu;

            return (
                <div className="min-h-screen flex bg-slate-50">
                    {/* Sidebar Desktop */}
                    <aside className="hidden md:flex flex-col w-64 bg-white border-r border-slate-100 p-5 fixed h-full z-20">
                        <div className="flex items-center gap-3 px-2 py-3 mb-6">
                            <div className="w-10 h-10 bg-gradient-to-tr from-sky-500 to-blue-600 rounded-2xl flex items-center justify-center text-white text-xl shadow-lg shadow-sky-200 font-black">
                                RK
                            </div>
                            <div>
                                <h1 className="font-black text-slate-800 text-base leading-tight">Ruang Kelasku</h1>
                                <p className="text-[11px] font-semibold text-slate-400">{profile.className} • {profile.school}</p>
                            </div>
                        </div>

                        <nav className="space-y-1.5 flex-1">
                            {navItems.map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => setCurrentView(item.id)}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-xs font-bold transition-all ${currentView === item.id ? 'bg-sky-50 text-sky-600 shadow-sm border border-sky-100' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'}`}
                                >
                                    <i className={`${item.icon} text-lg ${currentView === item.id ? 'text-sky-500' : 'text-slate-400'}`}></i>
                                    <span>{item.label}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="pt-4 border-t border-slate-100 flex items-center justify-between">
                            <div className="flex items-center gap-2 overflow-hidden">
                                <div className="w-8 h-8 rounded-full bg-sky-100 text-sky-600 flex items-center justify-center font-bold text-xs shrink-0">
                                    {user.name.charAt(0)}
                                </div>
                                <div className="truncate">
                                    <p className="text-xs font-bold text-slate-800 truncate">{user.name}</p>

        };

        const AssessmentRunner = ({ assessment, onCancel, onComplete, showToast }) => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState((assessment.timeLimit || 10) * 60);
            const [isFinished, setIsFinished] = useState(false);
            const [calculatedScore, setCalculatedScore] = useState(0);

            const questions = assessment.questions || [];

            useEffect(() => {
                if (isFinished || timeLeft <= 0) return;
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            handleSubmit();
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [timeLeft, isFinished]);

            const handleOptionSelect = (optionKey) => {
                if (isFinished) return;
                setAnswers(prev => ({
                    ...prev,
                    [questions[currentIndex].id]: optionKey
                }));
            };

            const handleSubmit = () => {
                let correctCount = 0;
                questions.forEach(q => {
                    if (answers[q.id] === q.correct) {
                        correctCount++;
                    }
                });

                const score = questions.length > 0 ? Math.round((correctCount / questions.length) * 100) : 0;
                setCalculatedScore(score);
                setIsFinished(true);
                onComplete(score);
                showToast("Jawaban kuis berhasil dikumpulkan!");
            };

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };

            if (questions.length === 0) {
                return (
                    <Card className="text-center py-12">
                        <i className="ph-duotone ph-warning-circle text-5xl text-amber-500 mb-3"></i>
                        <h3 className="font-bold text-slate-800 text-base">Soal Kuis Belum Tersedia</h3>
                        <p className="text-slate-500 text-xs mt-1 mb-4">Guru belum merilis butir soal untuk kuis ini.</p>
                        <Button variant="secondary" onClick={onCancel} className="mx-auto">Kembali</Button>
                    </Card>
                );
            }

            if (isFinished) {
                return (
                    <div className="max-w-2xl mx-auto space-y-6">
                        <Card className="text-center py-8 bg-white border border-slate-100 shadow-xl">
                            <div className="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
                                <i className="ph-bold ph-trophy"></i>
                            </div>
                            <h2 className="text-xl font-black text-slate-800">Kuis Selesai!</h2>
                            <p className="text-xs text-slate-500 mt-1">{assessment.title} • {assessment.subject}</p>
                            
                            <div className="my-6 inline-block bg-slate-50 px-8 py-4 rounded-3xl border border-slate-100">
                                <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Nilai Kamu</p>
                                <p className="text-5xl font-black text-sky-600 mt-1">{calculatedScore}</p>
                            </div>

                            <p className="text-xs font-semibold text-slate-600 max-w-sm mx-auto">
                                {calculatedScore >= 70 ? "Luar biasa! Hasil kerja kamu sangat memuaskan." : "Tetap semangat! Tingkatkan lagi belajarnya ya."}
                            </p>

                            <div className="mt-8 flex justify-center gap-3">
                                <Button variant="primary" onClick={onCancel}>Selesai & Kembali</Button>
                            </div>
                        </Card>
                    </div>
                );
            }

            const currentQ = questions[currentIndex];

            return (
                <div className="max-w-3xl mx-auto space-y-4">
                    <Card className="flex items-center justify-between p-4 bg-white border-slate-100 shadow-sm">
                        <div>
                            <span className="text-[11px] font-bold text-sky-600 bg-sky-50 px-2.5 py-1 rounded-lg">{assessment.subject}</span>
                            <h2 className="font-bold text-slate-800 text-sm mt-1">{assessment.title}</h2>
                        </div>
                        <div className="flex items-center gap-2 bg-amber-50 border border-amber-200 text-amber-700 px-3 py-1.5 rounded-xl font-bold text-xs">
                            <i className="ph-bold ph-clock"></i>
                            <span>Sisa Waktu: {formatTime(timeLeft)}</span>
                        </div>
                    </Card>

                    <Card className="p-6">
                        <div className="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                            <span className="text-xs font-bold text-slate-400 uppercase">Soal {currentIndex + 1} dari {questions.length}</span>
                            <div className="flex gap-1">
                                {questions.map((_, idx) => (
                                    <button 
                                        key={idx} 
                                        onClick={() => setCurrentIndex(idx)}
                                        className={`w-7 h-7 rounded-lg text-xs font-bold transition-all ${currentIndex === idx ? 'bg-sky-500 text-white' : answers[questions[idx].id] ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}`}
                                    >
                                        {idx + 1}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <p className="text-sm font-bold text-slate-800 leading-relaxed mb-6">{currentQ.text}</p>

                        <div className="space-y-2.5">
                            {Object.entries(currentQ.options || {}).map(([key, optText]) => {
                                const isSelected = answers[currentQ.id] === key;
                                return (
                                    <button
                                        key={key}
                                        onClick={() => handleOptionSelect(key)}
                                        className={`w-full text-left p-3.5 rounded-2xl border text-xs font-semibold flex items-center gap-3 transition-all ${isSelected ? 'bg-sky-50 border-sky-400 text-sky-800 shadow-sm' : 'bg-white border-slate-200 hover:border-slate-300 text-slate-700'}`}
                                    >
                                        <div className={`w-7 h-7 rounded-xl flex items-center justify-center font-bold text-xs shrink-0 ${isSelected ? 'bg-sky-500 text-white' : 'bg-slate-100 text-slate-500'}`}>
                                            {key}
                                        </div>
                                        <span className="flex-1">{optText}</span>
                                    </button>
                                );
                            })}
                        </div>

                        <div className="flex justify-between items-center mt-8 pt-4 border-t border-slate-100">
                            <Button 
                                variant="secondary" 
                                disabled={currentIndex === 0} 
                                onClick={() => setCurrentIndex(prev => prev - 1)}
                            >
                                <i className="ph-bold ph-arrow-left"></i> Sebelum
                            </Button>

                            {currentIndex === questions.length - 1 ? (
                                <Button variant="success" onClick={handleSubmit}>
                                    Kumpulkan Jawaban <i className="ph-bold ph-check-circle"></i>
                                </Button>
                            ) : (
                                <Button variant="primary" onClick={() => setCurrentIndex(prev => prev + 1)}>
                                    Selanjutnya <i className="ph-bold ph-arrow-right"></i>
                                </Button>
                            )}
                        </div>
                    </Card>
                </div>
            );
        };

        const RuangKelaskuApp = () => {
            const [db, setDb] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) { console.error(e); }
                }
                return DEFAULT_DATA;
            });

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
            }, [db]);

            const [user, setUser] = useState(null);
            const [currentView, setCurrentView] = useState('dashboard');
            const [toastMessage, setToastMessage] = useState(null);

            const [activeAssessment, setActiveAssessment] = useState(null);
            const [selectedMaterial, setSelectedMaterial] = useState(null);

            const [isQuizModalOpen, setIsQuizModalOpen] = useState(false);
            const [isAIQuizModalOpen, setIsAIQuizModalOpen] = useState(false);
            const [isGeneratingAIQuiz, setIsGeneratingAIQuiz] = useState(false);
            const [isMaterialModalOpen, setIsMaterialModalOpen] = useState(false);
            const [isAnnouncementModalOpen, setIsAnnouncementModalOpen] = useState(false);
            const [isStudentModalOpen, setIsStudentModalOpen] = useState(false);
            const [previewQuiz, setPreviewQuiz] = useState(null);

            const [profileForm, setProfileForm] = useState({ ...db.profile });
            const [announcementForm, setAnnouncementForm] = useState({ title: '', content: '', startDate: '', endDate: '', link: '' });
            const [materialForm, setMaterialForm] = useState({ id: null, subject: 'IPAS', title: '', meeting: 'Pertemuan 1', description: '', content: '', attachmentName: '', attachmentType: '', attachmentData: null });
            const [studentForm, setStudentForm] = useState({ name: '', username: '', password: '123' });

            useEffect(() => {
                if (db.profile) {
                    setProfileForm({ ...db.profile });
                }
            }, [currentView, db.profile]);
            
            const [quizForm, setQuizForm] = useState({
                title: '',
                subject: 'IPAS',
                instructions: 'Kerjakan soal pilihan ganda dengan benar.',
                timeLimit: 10,
                endDate: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().slice(0, 16),
                questions: [
                    { id: 'q_1', text: '', options: { A: '', B: '', C: '', D: '' }, correct: 'A', explanation: '' }
                ]
            });

            const [aiQuizForm, setAIQuizForm] = useState({
                apiKey: localStorage.getItem('ruang_kelasku_gemini_key') || '',
                subject: 'IPAS',
                material: '',
                level: 'Sedang',
                count: 10,
                title: ''
            });

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            const handleLogout = () => {
                setUser(null);
                setCurrentView('dashboard');
                showToast("Anda telah keluar dari akun.");
            };

            const handleSaveProfile = (e) => {
                e.preventDefault();
                const updatedProfile = { ...profileForm };
                
                // Simpan ke database local storage
                setDb(prev => ({ ...prev, profile: updatedProfile }));

                // Perbarui nama user aktif di sesi jika role adalah guru
                if (user && user.role === 'teacher') {
                    setUser(prev => ({ ...prev, name: updatedProfile.teacherName }));
                }

                showToast("Profil guru & kelas berhasil diperbarui!");
            };

            const handleSaveAnnouncement = (e) => {
                e.preventDefault();
                const newA = {
                    id: generateId(),
                    title: announcementForm.title,
                    content: announcementForm.content,
                    startDate: new Date().toISOString(),
                    endDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString(),
                    link: announcementForm.link,
                    status: 'aktif'
                };
                setDb(prev => ({ ...prev, announcements: [newA, ...prev.announcements] }));
                setIsAnnouncementModalOpen(false);
                setAnnouncementForm({ title: '', content: '', startDate: '', endDate: '', link: '' });
                showToast("Pengumuman berhasil diterbitkan!");
            };

            const handleDeleteAnnouncement = (id) => {
                setDb(prev => ({ ...prev, announcements: prev.announcements.filter(a => a.id !== id) }));
                showToast("Pengumuman berhasil dihapus!");
            };

            const handleCopyLink = (text) => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast("Tautan/Teks berhasil disalin!");
            };

            const handleSaveMaterial = (e) => {
                e.preventDefault();
                if (materialForm.id) {
                    setDb(prev => ({
                        ...prev,
                        materials: prev.materials.map(m => m.id === materialForm.id ? { ...materialForm } : m)
                    }));
                    showToast("Materi pelajaran diperbarui!");
                } else {
                    const newM = {
                        ...materialForm,
                        id: generateId(),
                        createdAt: new Date().toISOString()
                    };
                    setDb(prev => ({ ...prev, materials: [newM, ...prev.materials] }));
                    showToast("Materi pelajaran baru berhasil ditambahkan!");
                }
                setIsMaterialModalOpen(false);
                setMaterialForm({ id: null, subject: 'IPAS', title: '', meeting: 'Pertemuan 1', description: '', content: '', attachmentName: '', attachmentType: '', attachmentData: null });
            };

            const handleDeleteMaterial = (id) => {
                setDb(prev => ({ ...prev, materials: prev.materials.filter(m => m.id !== id) }));
                showToast("Materi berhasil dihapus!");
            };

            const handleMaterialFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const isPdf = file.type === 'application/pdf';
                const reader = new FileReader();
                reader.onload = (event) => {
                    setMaterialForm(prev => ({
                        ...prev,
                        attachmentName: file.name,
                        attachmentType: isPdf ? 'pdf' : 'image',
                        attachmentData: event.target.result
                    }));
                };
                reader.readAsDataURL(file);
            };

            const handleApplyQuizPreset = (count) => {
                const newQuestions = [];
                for (let i = 0; i < count; i++) {
                    newQuestions.push({
                        id: 'q_' + (i + 1),
                        text: `Pertanyaan Soal No ${i + 1}`,
                        options: { A: 'Pilihan A', B: 'Pilihan B', C: 'Pilihan C', D: 'Pilihan D' },
                        correct: 'A',
                        explanation: ''
                    });
                }
                setQuizForm(prev => ({ ...prev, questions: newQuestions }));
            };

            const handleGenerateAIQuiz = async (e) => {
                e.preventDefault();
                if (!aiQuizForm.apiKey.trim()) {
                    showToast('Masukkan Gemini API Key terlebih dahulu.');
                    return;
                }
                if (!aiQuizForm.material.trim()) {
                    showToast('Masukkan materi yang akan dibuat menjadi soal.');
                    return;
                }

                setIsGeneratingAIQuiz(true);
                localStorage.setItem('ruang_kelasku_gemini_key', aiQuizForm.apiKey.trim());

                const count = Math.min(20, Math.max(1, parseInt(aiQuizForm.count) || 10));
                const schema = {
                    type: 'object',
                    properties: {
                        title: { type: 'string' },
                        questions: {
                            type: 'array',
                            minItems: count,
                            maxItems: count,
                            items: {
                                type: 'object',
                                properties: {
                                    text: { type: 'string' },
                                    A: { type: 'string' },
                                    B: { type: 'string' },
                                    C: { type: 'string' },
                                    D: { type: 'string' },
                                    correct: { type: 'string', enum: ['A','B','C','D'] },
                                    explanation: { type: 'string' }
                                },
                                required: ['text','A','B','C','D','correct','explanation'],
                                additionalProperties: false
                            }
                        }
                    },
                    required: ['title','questions'],
                    additionalProperties: false
                };

                const prompt = `
Buat ${count} soal pilihan ganda untuk siswa SD kelas 6.
Mata pelajaran: ${aiQuizForm.subject}.
Materi: ${aiQuizForm.material}.
Level: ${aiQuizForm.level}.

Ketentuan:
- Gunakan bahasa Indonesia yang sederhana, jelas, dan sesuai siswa kelas 6.
- Setiap soal memiliki tepat 4 pilihan A, B, C, D.
- Hanya ada satu jawaban benar.
- Hindari soal yang ambigu, jawaban ganda, dan pilihan yang terlalu mudah ditebak.
- Buat pengecoh yang masuk akal.
- Sesuaikan tingkat kesulitan dengan level yang diminta.
- Untuk matematika, pastikan semua perhitungan dan kunci jawaban benar.
- Sertakan penjelasan singkat untuk setiap kunci jawaban agar guru dapat memeriksa.
- Kembalikan HANYA JSON sesuai schema.
`;

                try {
                    const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-goog-api-key': aiQuizForm.apiKey.trim()
                        },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: {
                                responseMimeType: 'application/json',
                                responseSchema: schema,
                                temperature: 0.7
                            }
                        })
                    });

                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data?.error?.message || 'Gagal menghubungi Gemini API.');
                    }

                    const rawText = data?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('');
                    if (!rawText) throw new Error('Gemini tidak mengembalikan soal.');

                    const generated = JSON.parse(rawText);
                    const questions = (generated.questions || []).slice(0, 20).map((q, i) => ({
                        id: 'ai_' + Date.now() + '_' + i,
                        text: q.text,
                        options: { A: q.A, B: q.B, C: q.C, D: q.D },
                        correct: q.correct,
                        explanation: q.explanation || ''
                    }));

                    if (!questions.length) throw new Error('Soal yang dihasilkan kosong.');

                    setQuizForm(prev => ({
                        ...prev,
                        title: aiQuizForm.title.trim() || generated.title || `Quiz ${aiQuizForm.subject} - ${aiQuizForm.level}`,
                        subject: aiQuizForm.subject,
                        questions
                    }));
                    setIsAIQuizModalOpen(false);
                    setIsQuizModalOpen(true);
                    showToast(`${questions.length} soal berhasil dibuat AI. Periksa dulu sebelum diterbitkan.`);
                } catch (error) {
                    console.error(error);
                    showToast('Gagal membuat soal AI: ' + error.message);
                } finally {
                    setIsGeneratingAIQuiz(false);
                }
            };

            const handleSaveQuiz = (e) => {
                e.preventDefault();
                const newQ = {
                    id: generateId(),
                    subject: quizForm.subject,
                    title: quizForm.title,
                    instructions: quizForm.instructions,
                    questionCount: quizForm.questions.length,
                    timeLimit: parseInt(quizForm.timeLimit) || 10,
                    endDate: new Date(quizForm.endDate).toISOString(),
                    status: 'aktif',
                    questions: quizForm.questions
                };
                setDb(prev => ({ ...prev, quizzes: [newQ, ...prev.quizzes] }));
                setIsQuizModalOpen(false);
                showToast("Kuis baru berhasil diterbitkan!");
            };

            const handleDeleteQuiz = (id) => {
                setDb(prev => ({ ...prev, quizzes: prev.quizzes.filter(q => q.id !== id) }));
                showToast("Kuis berhasil dihapus!");
            };

            const handleSaveStudent = (e) => {
                e.preventDefault();
                const newS = {
                    id: generateId(),
                    name: studentForm.name,
                    username: studentForm.username,
                    password: studentForm.password || '123',
                    status: 'aktif'
                };
                setDb(prev => ({ ...prev, students: [...prev.students, newS] }));
                setIsStudentModalOpen(false);
                setStudentForm({ name: '', username: '', password: '123' });
                showToast("Data siswa berhasil ditambahkan!");
            };

            const handleDeleteStudent = (student) => {
                const confirmed = window.confirm(`Hapus data siswa "${student.name}"?\n\nAkun siswa ini akan dihapus dari daftar login. Data nilai siswa tetap tersimpan.`);
                if (!confirmed) return;

                setDb(prev => ({
                    ...prev,
                    students: prev.students.filter(s => s.id !== student.id)
                }));
                showToast(`Data ${student.name} berhasil dihapus.`);
            };

            if (!user) {
                return <LoginPage onLogin={(userData) => setUser(userData)} db={db} showToast={showToast} />;
            }

            if (activeAssessment) {
                return (
                    <AssessmentRunner 
                        assessment={activeAssessment} 
                        onCancel={() => setActiveAssessment(null)}
                        onComplete={(score) => {
                            if (user.role === 'student') {
                                setDb(prev => ({
                                    ...prev,
                                    grades: [
                                        {
                                            id: generateId(),
                                            studentId: user.id,
                                            studentName: user.name,
                                            quizId: activeAssessment.id,
                                            quizTitle: activeAssessment.title,
                                            subject: activeAssessment.subject || "Pelajaran",
                                            score,
                                            date: new Date().toISOString()
                                        },
                                        ...prev.grades
                                    ]
                                }));
                            }
                        }}
                        showToast={showToast}
                    />
                );
            }

            return (
                <AppLayout user={user} setUser={setUser} currentView={currentView} setCurrentView={setCurrentView} profile={db.profile} onLogout={handleLogout}>
                    {/* View: Dashboard */}
                    {currentView === 'dashboard' && (
                        <div className="space-y-6">
                            {/* Welcome Banner */}
                            <div className="bg-gradient-to-r from-sky-500 to-blue-600 rounded-3xl p-6 md:p-8 text-white shadow-xl shadow-sky-100 relative overflow-hidden">
                                <div className="relative z-10 space-y-2">
                                    <span className="bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider">
                                        {db.profile.className} • {db.profile.school}
                                    </span>
                                    <h1 className="text-2xl md:text-3xl font-black">
                                        Selamat Datang, {user.name}! 👋
                                    </h1>
                                    <p className="text-xs md:text-sm text-sky-100 max-w-xl font-medium">

                                    <p className="text-xs font-medium text-slate-500 italic bg-slate-50 p-3 rounded-xl border border-slate-100">
                                        "{selectedMaterial.description}"
                                    </p>
                                </div>

                                {selectedMaterial.content && (
                                    <div className="space-y-2">
                                        <h4 className="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
                                            <i className="ph-bold ph-article text-sky-500"></i> Ringkasan Materi
                                        </h4>
                                        <div className="bg-slate-50/80 p-4 rounded-2xl border border-slate-100 text-xs text-slate-800 leading-relaxed whitespace-pre-wrap font-sans">
                                            {selectedMaterial.content}
                                        </div>
                                    </div>
                                )}

                                {selectedMaterial.attachmentData && (
                                    <div className="space-y-2 pt-2 border-t border-slate-100">
                                        <h4 className="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
                                            <i className="ph-bold ph-paperclip text-amber-500"></i> Lampiran Pembelajaran
                                        </h4>
                                        {selectedMaterial.attachmentType === 'image' ? (
                                            <div className="rounded-2xl overflow-hidden border border-slate-200">
                                                <img src={selectedMaterial.attachmentData} alt="Lampiran Materi" className="w-full max-h-96 object-contain bg-slate-900/5" />
                                            </div>
                                        ) : (
                                            <a 
                                                href={selectedMaterial.attachmentData} 
                                                download={selectedMaterial.attachmentName || "Ringkasan_Materi.pdf"}
                                                className="p-4 bg-sky-50 border border-sky-100 rounded-2xl flex items-center justify-between text-sky-700 text-xs font-bold hover:bg-sky-100 transition-colors shadow-sm"
                                            >
                                                <div className="flex items-center gap-3">
                                                    <i className="ph-bold ph-file-pdf text-2xl text-sky-600"></i>
                                                    <div>
                                                        <p className="font-bold">{selectedMaterial.attachmentName || "Ringkasan_Materi.pdf"}</p>
                                                        <p className="text-[10px] text-sky-500 font-normal">Klik untuk mengunduh dokumen PDF</p>
                                                    </div>
                                                </div>
                                                <div className="bg-sky-500 text-white p-2 rounded-xl">
                                                    <i className="ph-bold ph-download text-base"></i>
                                                </div>
                                            </a>
                                        )}
                                    </div>
                                )}

                                <div className="flex justify-end pt-3 border-t border-slate-100">
                                    <Button variant="secondary" onClick={() => setSelectedMaterial(null)}>
                                        Tutup Pembaca
                                    </Button>
                                </div>
                            </div>
                        )}
                    </Modal>

                    {/* Toast Notification */}
                    <Toast message={toastMessage} onClose={() => setToastMessage(null)} />
                </AppLayout>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RuangKelaskuApp />);
    </script>
</body>
</html>
